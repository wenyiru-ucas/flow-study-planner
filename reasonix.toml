allow = ["Bash(mkdir -p vendor && curl -sL -o vendor/chart.umd.min.js \"https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js\" && wc -c vendor/chart.umd.min.js)", "Bash=python3 -c \"import PIL; print('Pillow', PIL.__version__)\" 2>&1; which sips iconutil 2>&1", "Bash=cd \"/Users/wenyiru/Downloads/本地空间/Obsidian/04 学习计划助手开发\" && mkdir -p build/icon.iconset && python3 << 'EOF'\nfrom PIL import Image, ImageDraw, ImageFilter\nimport math\n\nS = 1024\nimg = Image.new('RGBA', (S, S), (0, 0, 0, 0))\nd = ImageDraw.Draw(img)\n\n# ── 圆角背景（暖橙渐变） ──\nmask = Image.new('L', (S, S), 0)\nmd = ImageDraw.Draw(mask)\nradius = 190\nmd.rounded_rectangle([0, 0, S-1, S-1], radius=radius, fill=255)\n\nbg = Image.new('RGBA', (S, S), (0, 0, 0, 0))\nbd = ImageDraw.Draw(bg)\ntop = (255, 178, 94)      # #FFB25E\nbot = (255, 122, 61)      # #FF7A3D\nfor y in range(S):\n    t = y / S\n    r = int(top[0] + (bot[0]-top[0])*t)\n    g = int(top[1] + (bot[1]-top[1])*t)\n    b = int(top[2] + (bot[2]-top[2])*t)\n    bd.line([(0, y), (S, y)], fill=(r, g, b, 255))\nimg.paste(bg, (0, 0), mask)\n\n# ── 番茄主体（深红渐变圆，带轻微椭圆感） ──\ntomato = Image.new('RGBA', (S, S), (0, 0, 0, 0))\ntd = ImageDraw.Draw(tomato)\ncx, cy = 512, 590          # 圆心\nrx, ry = 300, 270          # 半径（横向略宽）\n# 用逐行绘制模拟垂直渐变（顶部亮红 → 底部暗红）\ntopC = (235, 68, 46)       # #EB442E\nbotC = (196, 45, 32)       # #C42D20\nfor y in range(cy - ry, cy + ry):\n    # 计算这一行在椭圆内的半宽\n    dy = (y - cy) / ry\n    if abs(dy) > 1: continue\n    half_w = rx * math.sqrt(max(0, 1 - dy*dy))\n    t = (y - (cy - ry)) / (2 * ry)\n    r = int(topC[0] + (botC[0]-topC[0])*t)\n    g = int(topC[1] + (botC[1]-topC[1])*t)\n    b = int(topC[2] + (botC[2]-topC[2])*t)\n    td.line([(cx - half_w, y), (cx + half_w, y)], fill=(r, g, b, 255))\n# 番茄抗锯齿：轻微模糊边缘\ntomato = tomato.filter(ImageFilter.GaussianBlur(3))\nimg.alpha_composite(tomato)\n\n# ── 高光（左上椭圆） ──\nhl = Image.new('RGBA', (S, S), (0, 0, 0, 0))\nhd = ImageDraw.Draw(hl)\nhx, hy = 400, 470\nhrx, hry = 140, 85\nfor y in range(hy - hry, hy + hry):\n    dy = (y - hy) / hry\n    if abs(dy) > 1: continue\n    half_w = hrx * math.sqrt(max(0, 1 - dy*dy))\n    # 越靠近中心 alpha 越高\n    alpha = int(110 * (1 - abs(dy)))\n    hd.line([(hx - half_w, y), (hx + half_w, y)], fill=(255, 255, 255, alpha))\nhl = hl.filter(ImageFilter.GaussianBlur(12))\nimg.alpha_composite(hl)\n\n# ── 绿叶（顶部三叶） ──\nleaf = Image.new('RGBA', (S, S), (0, 0, 0, 0))\nld = ImageDraw.Draw(leaf)\n# 叶子用多个椭圆拼成五角星感：中心点在 (512, 330)\nleaf_g = (62, 160, 90)    # #3EA05A\nleaf_d = (38, 120, 60)    # #26783C\nfor ang, rad_x, rad_y, dy in [(-40, 95, 45, 15), (0, 110, 50, 0), (40, 95, 45, 15)]:\n    a = math.radians(ang)\n    ex = 512 + math.sin(a) * 150\n    ey = 335 + math.cos(a) * 30 + dy\n    # 旋转椭圆用多边形近似：画一个旋转矩形\n    poly = []\n    for i in range(50):\n        t = 2 * math.pi * i / 50\n        px = ex + math.cos(t) * rad_x\n        py = ey + math.sin(t) * rad_y\n        # 旋转\n        px2 = 512 + (px - 512) * math.cos(a) - (py - 335) * math.sin(a)\n        py2 = 335 + (px - 512) * math.sin(a) + (py - 335) * math.cos(a)\n        poly.append((px2, py2))\n    ld.polygon(poly, fill=leaf_g)\n# 中心茎\nld.rounded_rectangle([500, 285, 524, 350], radius=12, fill=leaf_d)\n# 叶子描边加深\nleaf = leaf.filter(ImageFilter.GaussianBlur(2))\nimg.alpha_composite(leaf)\n\n# 保存主图\nimg.save('build/icon-master.png')\nprint(\"主图生成完成:\", img.size)\nEOF", "Bash=cd \"/Users/wenyiru/Downloads/本地空间/Obsidian/04 学习计划助手开发\" && SRC=\"build/icon-master.png\" && for spec in \"icon_16x16.png 16\" \"icon_16x16@2x.png 32\" \"icon_32x32.png 32\" \"icon_32x32@2x.png 64\" \"icon_128x128.png 128\" \"icon_128x128@2x.png 256\" \"icon_256x256.png 256\" \"icon_256x256@2x.png 512\" \"icon_512x512.png 512\" \"icon_512x512@2x.png 1024\"; do\n  name=\"${spec%% *}\"; size=\"${spec##* }\"\n  sips -z $size $size \"$SRC\" --out \"build/icon.iconset/$name\" >/dev/null 2>&1\ndone\necho \"iconset 生成完成:\" && ls build/icon.iconset/ && iconutil -c icns build/icon.iconset -o build/icon.icns && echo \"---\" && ls -lh build/icon.icns", "Edit", "Bash=cd \"/Users/wenyiru/Downloads/本地空间/Obsidian/04 学习计划助手开发\" && rm -rf dist && npx electron-builder --mac --dir 2>&1 | grep -v \"deprecated\" | tail -8", "Bash=cd \"/Users/wenyiru/Downloads/本地空间/Obsidian/04 学习计划助手开发\" && APP=\"dist/mac-arm64/Flow学习计划助手.app\" && ls \"$APP\" >/dev/null 2>&1 && echo \"✅ .app 存在\" && ls -lh \"$APP/Contents/Resources/icon.icns\" 2>&1 && du -sh \"$APP\" && open dist/mac-arm64/"]
